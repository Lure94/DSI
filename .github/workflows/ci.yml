name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory:
                    backend
        
        steps:
            - uses: actions/checkout@v4
            
            - uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - run: npm ci
            - run: npm test
            - run: npm run build
        
    frontend:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Validar estructura
              run: |
                test -f frontend/index.html